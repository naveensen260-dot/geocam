<script>
/* GeoCam loader: app ka asli code Google Apps Script (Index.html) se aata hai.

const APP_SRC = 'https://script.google.com/macros/s/AKfycbxbpeliEEGSHwMEO_rJyJfR7j0v8G-7-w5f9jUaEiAbYAmhYrlW9uhMAEfowLCqtBXw/exec?raw=1';
const KEY = 'geocam.appHtml';
const FALLBACK = "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<meta name=\"theme-color\" content=\"#121a16\">\n<meta name=\"geocam-app\" content=\"1\">\n<meta name=\"mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<link rel=\"manifest\" href=\"manifest.json\">\n<link rel=\"icon\" href=\"icon-192.png\">\n<link rel=\"apple-touch-icon\" href=\"icon-192.png\">\n<title>GeoCam HD<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --ink:#121a16; --band:#1d2420; --haldi:#e8a93a; --paper:#f2efe6; --muted:#b9c2bb; --danger:#e0674f;\n  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);\n}\n*{box-sizing:border-box}\nhtml,body{height:100%;margin:0;background:#000;color:var(--paper);\n  font-family:Mukta,\"Noto Sans Devanagari\",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}\nbutton,input{font:inherit;color:inherit}\nbutton{border:0;cursor:pointer}\nbutton:focus-visible,input:focus-visible{outline:3px solid var(--haldi);outline-offset:2px}\n\n#cam{position:fixed;inset:0;overflow:hidden}\nvideo{width:100%;height:100%;object-fit:cover;background:#000}\n.mirror{transform:scaleX(-1)}\n\n.topwrap{position:absolute;left:0;right:0;top:0;padding-top:var(--safe-t);background:rgba(0,0,0,.4)}\n.offbar{background:#c0392b;color:#fff;font-weight:700;font-size:15px;text-align:center;padding:9px 12px;line-height:1.3}\n.brand{margin-left:auto;font-weight:700;font-size:17px}\n.top{padding:10px 12px;\n  display:flex;gap:8px;align-items:center}\n.chip{display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;\n  background:rgba(18,26,22,.8);font-size:14px;font-weight:600;white-space:nowrap}\n.dot{width:10px;height:10px;border-radius:50%;background:var(--haldi);animation:pulse 1.2s infinite}\n#gps[data-state=\"ok\"] .dot{background:#5fd18f;animation:none}\n#gps[data-state=\"weak\"] .dot{background:var(--haldi);animation:none}\n#gps[data-state=\"off\"] .dot{background:var(--danger);animation:none}\n@keyframes pulse{50%{opacity:.3}}\n\n.bottom{position:absolute;left:0;right:0;bottom:0;padding:0 12px calc(var(--safe-b) + 18px);\n  display:flex;flex-direction:column;gap:10px;background:rgba(0,0,0,.45)}\n  background:rgba(18,26,22,.85);font-size:16px}\n.live{background:rgba(29,36,32,.9);border-radius:10px;padding:9px 13px;font-size:14px;line-height:1.35}\n.live p{margin:0}\n#liveCo{color:var(--muted);font-size:13px;margin-top:2px}\n.controls{display:flex;justify-content:space-between;align-items:center;padding:4px 16px 0}\n.round{width:52px;height:52px;border-radius:50%;background:rgba(18,26,22,.8);display:grid;place-items:center}\n.shutter{width:76px;height:76px;border-radius:50%;background:var(--paper);\n  box-shadow:0 0 0 5px rgba(0,0,0,.35),0 0 0 9px var(--haldi);transition:transform .08s}\n.shutter:active{transform:scale(.92)}\n.spacer{width:52px;height:52px}\n\n.msg{position:absolute;left:20px;right:20px;top:35%;margin:0;padding:16px;border-radius:10px;\n  background:var(--band);text-align:center;font-size:16px;line-height:1.45}\n\n.screen{position:fixed;inset:0;background:var(--ink);display:flex;flex-direction:column;padding-top:var(--safe-t)}\n.shotWrap{flex:1;min-height:0;position:relative}\n#shot{position:absolute;left:12px;top:12px;width:calc(100% - 24px);height:calc(100% - 12px);object-fit:contain}\n.filters,.cats,.actions,.meta{flex:0 0 auto}\n.actions{display:flex;gap:10px;padding:12px 14px calc(var(--safe-b) + 16px)}\n.actions button{flex:1;height:50px;border-radius:10px;background:var(--band);font-weight:600;font-size:16px}\n.primary{background:var(--haldi)!important;color:var(--ink);font-weight:700!important}\n.meta{text-align:center;color:var(--muted);font-size:13px;margin:0 0 4px}\n.cats{display:flex;gap:8px;overflow-x:auto;padding:4px 14px;scrollbar-width:none}\n.cats::-webkit-scrollbar{display:none}\n.cat{flex:0 0 auto;height:34px;padding:0 14px;border-radius:999px;background:var(--band);color:var(--muted);font-size:14px;font-weight:600}\n.cat[aria-selected=\"true\"]{background:var(--paper);color:var(--ink)}\n.filters{display:flex;gap:10px;overflow-x:auto;padding:6px 14px 4px;scrollbar-width:none}\n.filters::-webkit-scrollbar{display:none}\n.fbtn{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;background:transparent;padding:0;\n  font-size:13px;line-height:1.15;text-align:center;color:var(--muted);width:76px}\n.fbtn img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:3px solid transparent}\n.fbtn[aria-checked=\"true\"]{color:var(--paper);font-weight:600}\n.fbtn[aria-checked=\"true\"] img{border-color:var(--haldi)}\n\n\n.perm{position:fixed;inset:0;z-index:6;background:var(--ink);display:grid;place-items:center;\n  padding:calc(var(--safe-t) + 20px) 20px calc(var(--safe-b) + 20px);overflow-y:auto}\n.permBox{width:100%;max-width:420px}\n.perm h1{margin:0 0 6px;font-size:28px}\n.perm p{margin:0 0 20px;color:var(--muted);font-size:16px;line-height:1.5}\n.prow{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:10px;border-radius:12px;background:var(--band)}\n.prow div{flex:1}\n.prow b{display:block;font-size:17px}\n.prow small{color:var(--muted);font-size:14px}\n.pdot{width:12px;height:12px;border-radius:50%;background:var(--haldi)}\n.prow .st{font-size:14px;font-weight:600;color:var(--haldi)}\n.prow[data-st=\"granted\"] .pdot{background:#5fd18f}\n.prow[data-st=\"granted\"] .st{color:#5fd18f}\n.prow[data-st=\"denied\"] .pdot{background:var(--danger)}\n.prow[data-st=\"denied\"] .st{color:var(--danger)}\n.permBtn{width:100%;height:54px;margin-top:10px;border-radius:12px;background:var(--haldi);color:var(--ink);font-size:18px;font-weight:700}\n.permBtn:disabled{opacity:.6}\n.permHelp{margin-top:16px!important;padding:14px;border-radius:12px;background:#3a1f1a;color:#ffd9d0!important;font-size:15px!important;white-space:pre-line}\n#busy{position:fixed;inset:0;background:rgba(18,26,22,.9);display:grid;place-content:center;justify-items:center;gap:14px;font-size:17px;z-index:4}\n.spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.2);border-top-color:var(--haldi);animation:spin .8s linear infinite}\n@keyframes spin{to{transform:rotate(360deg)}}\n#toast{position:fixed;left:16px;right:16px;top:calc(var(--safe-t) + 70px);padding:12px 14px;border-radius:10px;\n  background:var(--paper);color:var(--ink);font-weight:600;text-align:center;z-index:5}\n[hidden]{display:none!important}\n@media (prefers-reduced-motion:reduce){.dot,.spin{animation:none}}\n<\/style>\n<\/head>\n<body>\n\n<main id=\"cam\">\n  <video id=\"video\" autoplay playsinline muted><\/video>\n  <p id=\"camMsg\" class=\"msg\" hidden><\/p>\n  <div class=\"topwrap\">\n    <div id=\"offBar\" class=\"offbar\" role=\"alert\" hidden>You are offline: address will not be added, all other details will<\/div>\n    <header class=\"top\">\n      <div id=\"gps\" class=\"chip\" data-state=\"wait\"><span class=\"dot\"><\/span><span id=\"gpsTxt\">Finding GPS\u2026<\/span><\/div>\n      <span class=\"brand\">GeoCam HD<\/span>\n    <\/header>\n  <\/div>\n  <section class=\"bottom\">\n    <div class=\"live\" aria-live=\"polite\">\n      <p id=\"liveAddr\">Waiting for location\u2026<\/p>\n      <p id=\"liveCo\"><\/p>\n    <\/div>\n    <nav class=\"controls\">\n      <button id=\"flip\" class=\"round\" aria-label=\"Switch camera\">\n        <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 12a9 9 0 0 1 15.5-6.2L21 8\"/><path d=\"M21 3v5h-5\"/><path d=\"M21 12a9 9 0 0 1-15.5 6.2L3 16\"/><path d=\"M3 21v-5h5\"/><\/svg>\n      <\/button>\n      <button id=\"shutter\" class=\"shutter\" aria-label=\"Take photo\"><\/button>\n      <span class=\"spacer\" aria-hidden=\"true\"><\/span>\n    <\/nav>\n  <\/section>\n<\/main>\n\n<section id=\"review\" class=\"screen\" hidden>\n  <div class=\"shotWrap\"><img id=\"shot\" alt=\"Captured photo\"><\/div>\n  <p id=\"shotMeta\" class=\"meta\"><\/p>\n  <div id=\"cats\" class=\"cats\" role=\"tablist\" aria-label=\"Preset categories\"><\/div>\n  <div id=\"filters\" class=\"filters\" role=\"radiogroup\" aria-label=\"Choose a filter\"><\/div>\n  <nav class=\"actions\">\n    <button id=\"retake\">Retake<\/button>\n    <button id=\"share\">Share<\/button>\n    <button id=\"drive\" hidden>Drive<\/button>\n    <button id=\"save\" class=\"primary\">Save<\/button>\n  <\/nav>\n<\/section>\n\n<section id=\"perm\" class=\"perm\" hidden>\n  <div class=\"permBox\">\n    <h1>GeoCam HD<\/h1>\n    <p>GeoCam needs 2 permissions to stamp the correct location and time on your photos.<\/p>\n    <div id=\"pCam\" class=\"prow\" data-st=\"prompt\"><span class=\"pdot\"><\/span><div><b>Camera<\/b><small>To take photos<\/small><\/div><span class=\"st\">Pending<\/span><\/div>\n    <div id=\"pLoc\" class=\"prow\" data-st=\"prompt\"><span class=\"pdot\"><\/span><div><b>Location (GPS)<\/b><small>For latitude, longitude and address<\/small><\/div><span class=\"st\">Pending<\/span><\/div>\n    <button id=\"permBtn\" class=\"permBtn\">Allow access<\/button>\n    <p id=\"permHelp\" class=\"permHelp\" hidden><\/p>\n  <\/div>\n<\/section>\n\n<div id=\"busy\" hidden><div class=\"spin\"><\/div><p id=\"busyTxt\"><\/p><\/div>\n<div id=\"toast\" role=\"status\" hidden><\/div>\n\n<script>\nconst $ = s => document.querySelector(s);\nconst video = $('#video');\nlet stream = null, facing = 'environment', pos = null, addr = null, geoAt = null;\nlet outName = '', base = null, prev = null, snapNow = null, filterId = null, finalCache = null;\nconst IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;\n\n/* ---------- Local storage ---------- */\nconst store = {\n  get(k, d){ try{ const v = localStorage.getItem('geocam.' + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },\n  set(k, v){ try{ localStorage.setItem('geocam.' + k, JSON.stringify(v)); }catch(e){} }\n};\n\nfunction toast(t, ms = 3200){\n  const el = $('#toast'); el.textContent = t; el.hidden = false;\n  clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, ms);\n}\nfunction camMsg(t){ const el = $('#camMsg'); el.textContent = t || ''; el.hidden = !t; }\n\n/* ---------- Offline install ---------- */\n/* Auto update: naya version GitHub par aate hi app khud update ho jaata hai */\nlet updatePending = false;\nif (!IS_GAS && 'serviceWorker' in navigator){\n  const hadController = !!navigator.serviceWorker.controller;\n  navigator.serviceWorker.register('sw.js').then(reg => {\n    const check = () => { if (navigator.onLine) reg.update().catch(() => {}); };\n    addEventListener('online', check);\n    document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });\n    setInterval(check, 30 * 60 * 1000);\n  }).catch(() => {});\n  navigator.serviceWorker.addEventListener('controllerchange', () => {\n    if (!hadController || updatePending) return;\n    updatePending = true;\n    // photo dekhte waqt reload na ho; camera screen par ho to turant update\n    if ($('#review').hidden && $('#busy').hidden) location.reload();\n    else toast('A new version is ready. Tap \"Retake\" to update.', 5000);\n  });\n}\n\nfunction setNet(){\n  const on = navigator.onLine;\n  $('#offBar').hidden = on;\n  if (on) maybeGeocode();\n  renderLive();\n}\naddEventListener('online', setNet); addEventListener('offline', setNet);\n\n/* ---------- Camera ---------- */\nasync function startCam(){\n  if (stream) stream.getTracks().forEach(t => t.stop());\n  stream = null;\n  if (!window.isSecureContext || !navigator.mediaDevices){\n    camMsg('The camera only works on an https link. Open the app from its GitHub Pages link.'); return;\n  }\n  try{\n    stream = await navigator.mediaDevices.getUserMedia({\n      audio:false, video:{ facingMode:{ ideal:facing }, width:{ ideal:4096 }, height:{ ideal:3072 } }\n    });\n    video.srcObject = stream;\n    video.classList.toggle('mirror', facing === 'user');\n    camMsg('');\n  }catch(e){\n    camMsg('Camera could not start. Allow Camera for this site in browser settings, then reload.');\n  }\n}\n\n/* ---------- GPS ---------- */\nfunction setChip(state, text){ $('#gps').dataset.state = state; $('#gpsTxt').textContent = text; }\nlet gpsWatch = null;\nfunction gotPos(p){\n  // pehle aayi kam-sahi location ko baad wali zyada-sahi location badal deti hai\n  if (pos && p.coords.accuracy > pos.coords.accuracy * 1.5 && (p.timestamp - pos.timestamp) < 60000) return;\n  pos = p;\n  const acc = Math.round(p.coords.accuracy);\n  setChip(acc <= 30 ? 'ok' : 'weak', `GPS \u00b1${acc} m`);\n  renderLive(); maybeGeocode();\n}\nfunction gpsErr(e){\n  if (pos) return;\n  if (e.code === 1){\n    setChip('off', 'Location off: tap here');\n    $('#liveAddr').textContent = 'Location permission not given. Turn on phone Location and allow Location for this site, then tap the red button above.';\n  } else {\n    setChip('weak', 'Finding GPS\u2026');\n    $('#liveAddr').textContent = 'Finding GPS\u2026 Move to an open area or near a window.';\n  }\n}\nfunction startGPS(){\n  if (!navigator.geolocation){ setChip('off', 'GPS not available in this browser'); return; }\n  if (gpsWatch != null) navigator.geolocation.clearWatch(gpsWatch);\n  setChip('wait', 'Finding GPS\u2026');\n  // 1) jaldi wali location (network/WiFi se), 2) phir lagataar sahi GPS\n  navigator.geolocation.getCurrentPosition(gotPos, () => {}, { enableHighAccuracy:false, maximumAge:60000, timeout:15000 });\n  gpsWatch = navigator.geolocation.watchPosition(gotPos, e => {\n    gpsErr(e);\n    if (e.code === 3) setTimeout(startGPS, 2000);   // timeout par dobara koshish\n  }, { enableHighAccuracy:true, maximumAge:0, timeout:60000 });\n}\n$('#gps').addEventListener('click', () => { if (!pos) startGPS(); });\n\nfunction distM(a, b){\n  const R = 6371000, r = Math.PI/180;\n  const dLa = (b[0]-a[0])*r, dLo = (b[1]-a[1])*r;\n  const h = Math.sin(dLa/2)**2 + Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLo/2)**2;\n  return 2*R*Math.asin(Math.sqrt(h));\n}\n\n/* Online address (jab net ho) \u2014 cache bhi hota hai, baad mein offline kaam aaye */\nasync function maybeGeocode(){\n  if (!pos || !navigator.onLine || maybeGeocode.busy) return;\n  const la = pos.coords.latitude, lo = pos.coords.longitude;\n  if (geoAt && distM(geoAt, [la, lo]) < 150) return;\n  maybeGeocode.busy = true;\n  try{\n    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${la}&lon=${lo}&zoom=16&addressdetails=1&accept-language=en`);\n    const a = (await r.json()).address || {};\n    addr = {\n      place: a.village || a.town || a.city || a.suburb || a.hamlet || '',\n      district: (a.state_district || a.county || '').replace(/ District$/,''),\n      state: a.state || '', pin: a.postcode || '', country: a.country || 'India'\n    };\n    geoAt = [la, lo];\n  }catch(e){}\n  finally{ maybeGeocode.busy = false; renderLive(); }\n}\nfunction plusCode(lat, lng){\n  const A = '23456789CFGHJMPQRVWX';\n  lat = Math.min(90, Math.max(-90, lat)); if (lat === 90) lat -= 1e-9;\n  lng = ((lng + 180) % 360 + 360) % 360 - 180;\n  let la = Math.floor(Math.round((lat + 90) * 2.5e7 * 1e6) / 1e6);\n  let lo = Math.floor(Math.round((lng + 180) * 8192000 * 1e6) / 1e6);\n  let code = '';\n  for (let i = 0; i < 5; i++){ code = A[(la % 5) * 4 + (lo % 4)] + code; la = Math.floor(la / 5); lo = Math.floor(lo / 4); }\n  for (let i = 0; i < 5; i++){ code = A[lo % 20] + code; code = A[la % 20] + code; la = Math.floor(la / 20); lo = Math.floor(lo / 20); }\n  code = code.slice(0, 8) + '+' + code.slice(8);\n  return code.slice(0, 12);\n}\n\n/* ---------- Address: sirf internet se, manual nahi ---------- */\nfunction addressLine(la, lo){\n  if (!navigator.onLine || !addr || !geoAt || distM(geoAt, [la, lo]) > 300) return null;\n  const parts = [];\n  const add = v => { v = String(v || '').trim(); if (v && !parts.includes(v)) parts.push(v); };\n  add(plusCode(la, lo).slice(4)); add(addr.place); add(addr.district);\n  add([addr.state, addr.pin].filter(Boolean).join(' ')); add(addr.country);\n  return parts.join(', ');\n}\n\nfunction renderLive(){\n  if (!pos){ $('#liveAddr').textContent = 'Waiting for GPS location\u2026'; $('#liveCo').textContent = ''; return; }\n  const c = pos.coords;\n  $('#liveAddr').textContent = addressLine(c.latitude, c.longitude) ||\n    (navigator.onLine ? 'Finding address\u2026' : 'Offline: address will not be added');\n  $('#liveCo').textContent = `Lat ${c.latitude.toFixed(7)}\u00b0  Long ${c.longitude.toFixed(7)}\u00b0`;\n}\n\n/* ---------- Time ---------- */\nfunction fmt(d){\n  const p = n => String(n).padStart(2,'0');\n  const t = (h,m,s) => `${p((h+11)%12+1)}:${p(m)}:${p(s)} ${h < 12 ? 'AM' : 'PM'}`;\n  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];\n  return {\n    local: t(d.getHours(), d.getMinutes(), d.getSeconds()),\n    gmt: t(d.getUTCHours(), d.getUTCMinutes(), d.getUTCSeconds()),\n    date: `${days[d.getDay()]}, ${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()}`,\n    file: `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`\n  };\n}\n\n/* ---------- Filters (presets) ---------- */\nconst CATS = [\n  { id:'natural', name:'Natural' },\n  { id:'nature',  name:'Nature' },\n  { id:'food',    name:'Food' },\n  { id:'doc',     name:'Documents' },\n  { id:'style',   name:'Style' }\n];\nconst FILTERS = [\n  // Natural\n  { id:'original', cat:'natural', name:'Original',   p:null },\n  { id:'hd',       cat:'natural', name:'HD Natural', p:{ wb:1, hl:.28, sh:.12, con:.15, sat:1.12, sharp:.55 } },\n  { id:'bright',   cat:'natural', name:'Bright',   p:{ wb:1, hl:.30, sh:.25, exp:1.12, con:.12, sat:1.10, sharp:.50 } },\n  { id:'indoor',   cat:'natural', name:'Indoor', p:{ wb:1, warm:-.09, hl:.30, sh:.20, exp:1.06, con:.12, sat:1.05, sharp:.50 } },\n  { id:'soft',     cat:'natural', name:'Soft',       p:{ wb:1, hl:.35, sh:.18, exp:1.05, con:.05, sat:1.05, warm:.04, sharp:-.45 } },\n  // Prakriti\n  { id:'hariyali', cat:'nature',  name:'Greenery',   p:{ wb:.3, hl:.40, con:.30, dark:.30, sat:1.15, green:1, sharp:.60, vig:.35 } },\n  { id:'aasmaan',  cat:'nature',  name:'Sky',    p:{ wb:.5, hl:.35, con:.20, sat:1.10, sky:1, green:.4, sharp:.55 } },\n  { id:'sunehra',  cat:'nature',  name:'Golden',    p:{ hl:.30, sh:.10, con:.18, sat:1.15, warm:.10, split:{ sh:[60,40,90], hi:[255,190,90], amt:.12 }, vig:.20, sharp:.45 } },\n  { id:'mitti',    cat:'nature',  name:'Earthy',      p:{ con:.20, sat:.85, warm:.07, lift:12, split:{ sh:[50,60,50], hi:[230,190,140], amt:.10 }, sharp:.50 } },\n  // Khana\n  { id:'swad',     cat:'food',    name:'Tasty',       p:{ wb:.6, hl:.30, sh:.15, exp:1.05, con:.22, sat:1.20, food:1, warm:.03, sharp:.65, vig:.15 } },\n  { id:'taaza',    cat:'food',    name:'Fresh',      p:{ wb:1, exp:1.10, hl:.35, sh:.20, con:.15, sat:1.18, food:.6, green:.5, sharp:.60 } },\n  // Register / Kagaz\n  { id:'register', cat:'doc',     name:'Register',   p:{ wb:1, bp:35, wp:205, con:.25, sat:.70, sharp:.85 } },\n  { id:'docbw',    cat:'doc',     name:'Doc B&W',  p:{ gray:1, bp:50, wp:190, con:.40, sharp:.90 } },\n  // Style\n  { id:'vivid',    cat:'style',   name:'Vivid',    p:{ wb:1, hl:.25, sh:.10, con:.30, sat:1.35, sharp:.60 } },\n  { id:'warm',     cat:'style',   name:'Warm',      p:{ wb:.5, hl:.28, sh:.12, con:.15, sat:1.12, warm:.08, sharp:.50 } },\n  { id:'cool',     cat:'style',   name:'Cool',     p:{ wb:.5, hl:.28, sh:.12, con:.15, sat:1.08, warm:-.07, sharp:.50 } },\n  { id:'cinema',   cat:'style',   name:'Cinema',     p:{ hl:.30, con:.28, sat:1.05, split:{ sh:[0,90,110], hi:[255,170,90], amt:.16 }, vig:.30, sharp:.50 } },\n  { id:'vintage',  cat:'style',   name:'Vintage',p:{ con:.10, sat:.75, warm:.08, lift:28, split:{ sh:[40,60,80], hi:[255,220,170], amt:.10 }, vig:.25 } },\n  { id:'bw',       cat:'style',   name:'B&W',        p:{ hl:.20, sh:.10, con:.30, gray:1, sharp:.60 } }\n];\n\nfunction copyCanvas(src, W, H){\n  const c = document.createElement('canvas');\n  c.width = W || src.width; c.height = H || src.height;\n  const x = c.getContext('2d', { willReadFrequently:true });\n  x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';\n  x.drawImage(src, 0, 0, c.width, c.height);\n  return c;\n}\nfunction scaledCopy(src, maxSide){\n  const s = Math.min(1, maxSide / Math.max(src.width, src.height));\n  return copyCanvas(src, Math.round(src.width * s), Math.round(src.height * s));\n}\n\nfunction applyFilter(src, p){\n  const c = copyCanvas(src);\n  if (!p) return c;\n  const x = c.getContext('2d', { willReadFrequently:true });\n  const W = c.width, H = c.height;\n  const img = x.getImageData(0, 0, W, H), d = img.data;\n\n  let gr = 1, gg = 1, gb = 1;\n  if (p.wb){\n    let sr = 0, sg = 0, sb = 0, n = 0;\n    for (let i = 0; i < d.length; i += 64){ sr += d[i]; sg += d[i+1]; sb += d[i+2]; n++; }\n    sr /= n; sg /= n; sb /= n; const m = (sr + sg + sb) / 3;\n    const gain = v => Math.min(1.15, Math.max(0.88, 0.65 + 0.35 * m / Math.max(v, 1)));\n    gr = 1 + p.wb * (gain(sr) - 1); gg = 1 + p.wb * (gain(sg) - 1); gb = 1 + p.wb * (gain(sb) - 1);\n  }\n  const ex = p.exp || 1, wm = p.warm || 0;\n  gr *= ex * (1 + wm); gg *= ex; gb *= ex * (1 - wm);\n\n  const hl = p.hl || 0, sh = p.sh || 0, con = p.con || 0, sat = p.sat || 1;\n  const lut = new Float32Array(256);\n  const bp = p.bp || 0, wp = p.wp || 255, lift = p.lift || 0;\n  for (let y = 0; y < 256; y++){\n    let v = Math.min(255, Math.max(0, (y - bp) * 255 / (wp - bp)));\n    if (v > 175) v = 175 + (v - 175) * (1 - hl);\n    if (v < 60)  v = v + (60 - v) * sh;\n    let t = v / 255;\n    if (p.dark) t = Math.pow(t, 1 + p.dark);\n    const s = t < .5 ? 2*t*t : 1 - 2*(1-t)*(1-t);\n    const o = (t * (1 - con) + s * con) * 255;\n    lut[y] = lift + o * (1 - lift / 255);\n  }\n  for (let i = 0; i < d.length; i += 4){\n    let r = d[i]*gr, g = d[i+1]*gg, b = d[i+2]*gb;\n    const Y = 0.299*r + 0.587*g + 0.114*b;\n    const Yn = lut[Y > 255 ? 255 : Y | 0];\n    if (p.gray){ d[i] = d[i+1] = d[i+2] = Yn; continue; }\n    const k = Y > 0.5 ? Yn / Y : 1;\n    r *= k; g *= k; b *= k;\n    r = Yn + (r - Yn) * sat; g = Yn + (g - Yn) * sat; b = Yn + (b - Yn) * sat;\n    if (p.green){\n      const gn = g - Math.max(r, b);\n      if (gn > 0){\n        const w = Math.min(1, gn / 40) * p.green;\n        r *= 1 - 0.45 * w;            // peela-pan hatao\n        b += (g - b) * 0.18 * w;      // halka emerald / teal\n        g *= 1 + 0.10 * w;            // patti ka hara gehra aur saaf\n      }\n    }\n    if (p.sky){\n      const bn = b - Math.max(r, g);\n      if (bn > 0){ const w = Math.min(1, bn / 40) * p.sky; b *= 1 + 0.12 * w; r *= 1 - 0.25 * w; g *= 1 - 0.05 * w; }\n    }\n    if (p.food && r > g && r > b){\n      const w = Math.min(1, (r - b) / 80) * p.food;\n      r *= 1 + 0.07 * w; g *= 1 + 0.02 * w; b *= 1 - 0.10 * w;\n    }\n    if (p.split){\n      const t = Yn / 255, ws = (1 - t) * (1 - t) * p.split.amt, wh = t * t * p.split.amt;\n      const S = p.split.sh, Hh = p.split.hi;\n      r += (S[0] - r) * ws + (Hh[0] - r) * wh;\n      g += (S[1] - g) * ws + (Hh[1] - g) * wh;\n      b += (S[2] - b) * ws + (Hh[2] - b) * wh;\n    }\n    d[i] = r; d[i+1] = g; d[i+2] = b;\n  }\n  x.putImageData(img, 0, 0);\n\n  if (p.sharp){\n    const bc = document.createElement('canvas'); bc.width = W; bc.height = H;\n    const bx = bc.getContext('2d', { willReadFrequently:true });\n    if ('filter' in bx){\n      const rad = Math.max(0.6, W / 1600) * (p.sharp < 0 ? 2.5 : 1);\n      bx.filter = `blur(${rad.toFixed(2)}px)`; bx.drawImage(c, 0, 0); bx.filter = 'none';\n      const bd = bx.getImageData(0, 0, W, H).data, a = p.sharp;\n      for (let i = 0; i < d.length; i += 4){\n        d[i] += a * (d[i] - bd[i]); d[i+1] += a * (d[i+1] - bd[i+1]); d[i+2] += a * (d[i+2] - bd[i+2]);\n      }\n      x.putImageData(img, 0, 0);\n    }\n  }\n  if (p.vig){\n    const gr2 = x.createRadialGradient(W/2, H/2, Math.min(W, H) * 0.35, W/2, H/2, Math.hypot(W, H) / 2);\n    gr2.addColorStop(0, 'rgba(0,0,0,0)'); gr2.addColorStop(1, `rgba(0,0,0,${p.vig})`);\n    x.fillStyle = gr2; x.fillRect(0, 0, W, H);\n  }\n  return c;\n}\n\n/* ---------- GPS stamp ---------- */\nfunction wrap(ctx, text, max){\n  const words = text.split(' '), lines = []; let line = '';\n  for (const w of words){\n    const test = line ? line + ' ' + w : w;\n    if (ctx.measureText(test).width > max && line){ lines.push(line); line = w; } else line = test;\n  }\n  if (line) lines.push(line);\n  return lines;\n}\nfunction stamp(c, snap){\n  const W = c.width, H = c.height, f = W / 1600;\n  const t = fmt(snap.time), co = snap.pos ? snap.pos.coords : null;\n  const addrText = snap.addr || (snap.online ? 'Address not found' : 'OFFLINE: Address not available');\n  const fam = 'Mukta, \"Noto Sans Devanagari\", sans-serif';\n  const addrFont = `600 ${Math.round(44*f)}px ${fam}`;\n  const m = document.createElement('canvas').getContext('2d'); m.font = addrFont;\n  const lines = wrap(m, snap.addr ? snap.addr + ' \ud83c\uddee\ud83c\uddf3' : addrText, W - 140*f), lineH = 58*f;\n  const bandH = Math.round(50*f + lines.length*lineH + 30*f + 130*f + 60*f + 60*f + 40*f);\n  const out = document.createElement('canvas'); out.width = W; out.height = H + bandH;\n  const x = out.getContext('2d');\n  x.drawImage(c, 0, 0);\n  x.fillStyle = '#1d2420'; x.fillRect(0, H, W, bandH);\n  x.textBaseline = 'top';\n  x.font = `700 ${Math.round(26*f)}px ${fam}`; x.fillStyle = '#e8a93a'; x.textAlign = 'right';\n  x.fillText('GeoCam HD', W - 30*f, H + 14*f);\n  let y = H + 50*f;\n  x.font = addrFont; x.fillStyle = snap.addr ? '#ffffff' : '#ff8a75'; x.textAlign = 'center';\n  for (const l of lines){ x.fillText(l, W/2, y); y += lineH; }\n  y += 30*f;\n  const L = 60*f, R = W * 0.53;\n  x.textAlign = 'left';\n  x.font = `400 ${Math.round(38*f)}px ${fam}`; x.fillStyle = '#c9d1ca';\n  x.fillText('Latitude', L, y); x.fillText('Longitude', R, y);\n  y += 50*f;\n  x.font = `600 ${Math.round(52*f)}px ${fam}`; x.fillStyle = '#ffffff';\n  if (co){ x.fillText(co.latitude.toFixed(7) + '\u00b0', L, y); x.fillText(co.longitude.toFixed(7) + '\u00b0', R, y); }\n  else { x.fillStyle = '#ff8a75'; x.fillText('GPS not found', L, y); x.fillText('GPS not found', R, y); x.fillStyle = '#ffffff'; }\n  y += 80*f;\n  x.font = `400 ${Math.round(40*f)}px ${fam}`;\n  const alt = !co ? 'Altitude \u2013' : co.altitude != null ? `Altitude ${Math.round(co.altitude)} meters` : `Accuracy \u00b1${Math.round(co.accuracy)} m`;\n  x.fillText(`Local ${t.local}`, L, y); x.fillText(alt, R, y);\n  y += 60*f;\n  x.fillText(`GMT ${t.gmt}`, L, y); x.fillText(t.date, R, y);\n  return out;\n}\n\n/* ---------- Capture ---------- */\n// busy(true) = sirf ghoomta gola, busy('text') = gola + likha, busy('') = band\nfunction busy(t){ $('#busyTxt').textContent = typeof t === 'string' ? t : ''; $('#busy').hidden = !t; }\n\nasync function capture(){\n  if (!stream) return toast('Please start the camera first');\n  busy(true);\n  // online ho aur address abhi aa raha ho to thoda (max 4 sec) rukein\n  if (pos && navigator.onLine && !addressLine(pos.coords.latitude, pos.coords.longitude)){\n    maybeGeocode();\n    for (let i = 0; i < 20 && !addressLine(pos.coords.latitude, pos.coords.longitude); i++) await new Promise(r => setTimeout(r, 200));\n  }\n  snapNow = {\n    pos, online: navigator.onLine, time: new Date(),\n    addr: pos ? addressLine(pos.coords.latitude, pos.coords.longitude) : null\n  };\n  if (!pos) toast('GPS not found: location will not be added to the photo', 4000);\n  await new Promise(r => setTimeout(r, 40));\n  try{\n    try{ await document.fonts.load('600 40px Mukta'); }catch(e){}\n    let src = null, sw = 0, sh = 0;\n    try{\n      if ('ImageCapture' in window){\n        const blob = await new ImageCapture(stream.getVideoTracks()[0]).takePhoto();\n        src = await createImageBitmap(blob); sw = src.width; sh = src.height;\n      }\n    }catch(e){ src = null; }\n    if (!src){ src = video; sw = video.videoWidth; sh = video.videoHeight; }\n    const long = Math.max(sw, sh); let s = 1;\n    if (long < 3000) s = Math.min(2, 3600 / long);\n    if (long * s > 4000) s = 4000 / long;\n    base = copyCanvas(src, Math.round(sw * s), Math.round(sh * s));\n    prev = scaledCopy(base, 1100);\n    outName = `GeoCam_${fmt(snapNow.time).file}.jpg`;\n    thumbCache = {}; smallPrev = null;\n    const saved = FILTERS.find(q => q.id === store.get('filter', 'hd')) || FILTERS[1];\n    filterId = saved.id; catId = saved.cat;\n    renderCats(); renderThumbs();\n    showFilter(saved.id);\n    $('#review').hidden = false;\n  }catch(e){\n    toast('Could not process the photo. Please try again.');\n  }finally{ busy(''); }\n}\n\nlet catId = 'natural', thumbCache = {}, smallPrev = null;\n\nfunction renderCats(){\n  const box = $('#cats'); box.innerHTML = '';\n  for (const c of CATS){\n    const b = document.createElement('button');\n    b.className = 'cat'; b.setAttribute('role', 'tab'); b.textContent = c.name;\n    b.setAttribute('aria-selected', c.id === catId);\n    b.onclick = () => { catId = c.id; renderCats(); renderThumbs(); };\n    box.appendChild(b);\n  }\n}\n\nfunction renderThumbs(){\n  const box = $('#filters'); box.innerHTML = '';\n  if (!smallPrev) smallPrev = scaledCopy(prev, 150);\n  for (const f of FILTERS.filter(q => q.cat === catId)){\n    const b = document.createElement('button');\n    b.className = 'fbtn'; b.setAttribute('role', 'radio'); b.dataset.id = f.id;\n    b.setAttribute('aria-checked', f.id === filterId);\n    const im = document.createElement('img'); im.alt = '';\n    im.src = thumbCache[f.id] || (thumbCache[f.id] = applyFilter(smallPrev, f.p).toDataURL('image/jpeg', .8));\n    const span = document.createElement('span'); span.textContent = f.name;\n    b.append(im, span);\n    b.onclick = () => showFilter(f.id);\n    box.appendChild(b);\n  }\n}\n\nfunction showFilter(id){\n  const f = FILTERS.find(q => q.id === id) || FILTERS[1];\n  filterId = f.id; finalCache = null; store.set('filter', f.id);\n  for (const b of document.querySelectorAll('.fbtn')) b.setAttribute('aria-checked', b.dataset.id === f.id);\n  const out = stamp(applyFilter(prev, f.p), snapNow);\n  $('#shot').src = out.toDataURL('image/jpeg', .88);\n  $('#shotMeta').textContent = `${f.name} \u00b7 ${base.width} \u00d7 ${base.height} px`;\n}\n\nasync function finalBlob(){\n  if (finalCache && finalCache.id === filterId) return finalCache.blob;\n  busy(true);\n  await new Promise(r => setTimeout(r, 40));\n  try{\n    const f = FILTERS.find(q => q.id === filterId);\n    const out = stamp(applyFilter(base, f.p), snapNow);\n    const blob = await new Promise(r => out.toBlob(r, 'image/jpeg', 0.95));\n    finalCache = { id: filterId, blob };\n    return blob;\n  }finally{ busy(''); }\n}\n\n/* ---------- Buttons ---------- */\n$('#shutter').onclick = capture;\n$('#flip').onclick = () => { facing = facing === 'user' ? 'environment' : 'user'; startCam(); };\n$('#retake').onclick = () => { if (updatePending) return location.reload(); $('#review').hidden = true; };\n$('#save').onclick = async () => {\n  const blob = await finalBlob();\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(blob); a.download = outName;\n  document.body.appendChild(a); a.click(); a.remove();\n  setTimeout(() => URL.revokeObjectURL(a.href), 4000);\n  toast('Photo saved (Downloads folder)');\n};\n$('#share').onclick = async () => {\n  const blob = await finalBlob();\n  const file = new File([blob], outName, { type:'image/jpeg' });\n  if (navigator.canShare && navigator.canShare({ files:[file] })){\n    try{ await navigator.share({ files:[file] }); }catch(e){}\n  } else toast('Sharing is not supported on this phone. Save the photo and send it on WhatsApp.');\n};\nif (IS_GAS){\n  $('#drive').hidden = false;\n  $('#drive').onclick = async () => {\n    const blob = await finalBlob();\n    const dataUrl = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });\n    busy('Saving to Drive\u2026');\n    google.script.run\n      .withSuccessHandler(() => { busy(''); toast('Saved to the \"GeoCam Photos\" folder in Drive'); })\n      .withFailureHandler(e => { busy(''); toast('Could not save to Drive: ' + (e && e.message || 'check your internet')); })\n      .savePhoto(dataUrl, outName);\n  };\n}\n\n/* ---------- App khulte hi ijaazat ---------- */\nasync function permState(name){\n  try{ return (await navigator.permissions.query({ name })).state; }catch(e){ return 'prompt'; }\n}\nfunction setRow(sel, st){\n  const el = $(sel); el.dataset.st = st;\n  el.querySelector('.st').textContent = st === 'granted' ? 'Allowed \u2713' : st === 'denied' ? 'Blocked' : 'Pending';\n}\nasync function refreshPerm(){\n  const cam = stream ? 'granted' : await permState('camera');\n  const loc = pos ? 'granted' : await permState('geolocation');\n  setRow('#pCam', cam); setRow('#pLoc', loc);\n  return { cam, loc };\n}\nfunction permHelp(t){ $('#permHelp').textContent = t || ''; $('#permHelp').hidden = !t; }\nconst DENIED_HELP = 'Permission is blocked. To turn it on:\\n1. Open Chrome \u2192 \u22ee \u2192 Settings \u2192 Site settings\\n2. In \"Camera\" and \"Location\", choose naveensen260-dot.github.io \u2192 Allow\\n3. Phone Settings \u2192 Apps \u2192 Chrome \u2192 Permissions \u2192 allow Camera and Location\\n4. Close GeoCam and open it again';\n\nasync function askPermissions(){\n  $('#permBtn').disabled = true; permHelp('');\n  await startCam();\n  let gpsOff = false;\n  await new Promise(res => navigator.geolocation\n    ? navigator.geolocation.getCurrentPosition(p => { gotPos(p); res(); },\n        e => { if (e.code === 2 || e.code === 3) gpsOff = true; res(); },\n        { enableHighAccuracy:false, maximumAge:60000, timeout:15000 })\n    : res());\n  startGPS();\n  const st = await refreshPerm();\n  $('#permBtn').disabled = false;\n  if (st.cam === 'granted' && st.loc === 'granted'){\n    $('#perm').hidden = true;\n    if (gpsOff && !pos) toast('Please turn on phone Location (GPS)', 5000);\n  } else if (st.cam === 'denied' || st.loc === 'denied'){\n    permHelp(DENIED_HELP);\n  } else if (gpsOff){\n    permHelp('Phone Location (GPS) is off. Pull down the notification bar, turn on \"Location\", then tap \"Allow access\" again.');\n  }\n}\n\nasync function initPerms(){\n  const st = await refreshPerm();\n  if (st.cam === 'granted' && st.loc === 'granted'){ startCam(); startGPS(); return; }\n  $('#perm').hidden = false;\n  if (st.cam === 'denied' || st.loc === 'denied') permHelp(DENIED_HELP);\n  else askPermissions();   // khulte hi ijaazat ka popup\n  // settings se ijaazat dene par screen apne aap hat jaaye\n  for (const n of ['camera', 'geolocation']){\n    try{\n      (await navigator.permissions.query({ name:n })).onchange = async () => {\n        const s2 = await refreshPerm();\n        if (s2.cam === 'granted' && s2.loc === 'granted'){ if (!stream) await startCam(); startGPS(); $('#perm').hidden = true; }\n      };\n    }catch(e){}\n  }\n}\n$('#permBtn').onclick = askPermissions;\n\nsetNet();\ninitPerms();\n<\/script>\n<\/body>\n<\/html>\n";

function isApp(h){ return typeof h === 'string' && h.includes('name="geocam-app"') && h.includes('</html>'); }
function show(h){ document.open(); document.write(h); document.close(); }

(async () => {
  let html = null;
  if (navigator.onLine){
    try{
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 7000);
      const r = await fetch(APP_SRC + '&t=' + Date.now(), { signal: ctrl.signal, cache: 'no-store' });
      clearTimeout(t);
      const txt = await r.text();
      if (r.ok && isApp(txt)){ html = txt; try{ localStorage.setItem(KEY, txt); }catch(e){} }
    }catch(e){}
  }
  if (!html){ try{ const c = localStorage.getItem(KEY); if (isApp(c)) html = c; }catch(e){} }
  show(html || FALLBACK);
})();
