# GeoCam HD – Android APK banane ka workflow
# GitHub mein is file ko yahan rakhein:  .github/workflows/main.yml
# Phir: Actions tab → "Build GeoCam APK" → Run workflow

name: Build GeoCam APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Aapke app ka GitHub Pages link (aakhir mein / zaroor rakhein)
      APP_URL: https://naveensen260-dot.github.io/geocam/GeoCam-GitHub/
      APP_NAME: GeoCam HD
      APP_ID: io.github.naveensen260dot.geocam

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Android project banana
        run: |
          mkdir -p twa/app/src/main/res/mipmap-xxxhdpi twa/app/src/main/res/values
          ICON=$(find . -path ./twa -prune -o -name 'icon-512.png' -print | head -n 1)
          cp "$ICON" twa/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cat > twa/settings.gradle <<'GRADLE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "GeoCam"
          include ':app'
          GRADLE

          cat > twa/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' version '8.2.2' apply false }
          GRADLE

          cat > twa/gradle.properties <<'GRADLE'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          GRADLE

          cat > twa/app/build.gradle <<GRADLE
          plugins { id 'com.android.application' }
          android {
              namespace '${APP_ID}'
              compileSdk 34
              defaultConfig {
                  applicationId '${APP_ID}'
                  minSdk 21
                  targetSdk 34
                  versionCode ${{ github.run_number }}
                  versionName '1.${{ github.run_number }}'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
          }
          GRADLE

          cat > twa/app/src/main/res/values/res.xml <<XML
          <resources>
              <string name="app_name">${APP_NAME}</string>
              <color name="ink">#121a16</color>
          </resources>
          XML

          cat > twa/app/src/main/AndroidManifest.xml <<XML
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Translucent.NoTitleBar">
                  <activity
                      android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"
                      android:label="@string/app_name"
                      android:exported="true">
                      <meta-data android:name="android.support.customtabs.trusted.DEFAULT_URL"
                          android:value="${APP_URL}" />
                      <meta-data android:name="android.support.customtabs.trusted.STATUS_BAR_COLOR"
                          android:resource="@color/ink" />
                      <meta-data android:name="android.support.customtabs.trusted.NAVIGATION_BAR_COLOR"
                          android:resource="@color/ink" />
                      <meta-data android:name="android.support.customtabs.trusted.SCREEN_ORIENTATION"
                          android:value="portrait" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

      - name: APK build karna
        working-directory: twa
        run: gradle assembleDebug --no-daemon

      - name: APK ka naam badalna
        run: cp twa/app/build/outputs/apk/debug/app-debug.apk GeoCam-HD.apk

      # APK seedha "Releases" mein .apk file ki tarah aayegi (zip/rar nahi)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: GeoCam HD v1.${{ github.run_number }}
          body: "Neeche Assets mein GeoCam-HD.apk dabakar download karein."
          files: GeoCam-HD.apk
          make_latest: true
