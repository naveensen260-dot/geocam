# GeoCam HD – Android APK banane ka workflow
# GitHub mein is file ko yahan rakhein:  .github/workflows/main.yml
# Phir: Actions tab → "Build GeoCam APK" → Run workflow

name: Build GeoCam APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Aapke app ka GitHub Pages link (aakhir mein / zaroor rakhein)
      APP_URL: https://naveensen260-dot.github.io/geocam/GeoCam-GitHub/
      APP_NAME: GeoCam HD
      APP_ID: io.github.naveensen260dot.geocam

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Android project banana
        run: |
          mkdir -p twa/app/src/main/res/mipmap-xxxhdpi twa/app/src/main/res/values twa/app/src/main/java/io/github/naveensen260dot/geocam
          ICON=$(find . -path ./twa -prune -o -name 'icon-512.png' -print | head -n 1)
          cp "$ICON" twa/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cat > twa/settings.gradle <<'GRADLE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "GeoCam"
          include ':app'
          GRADLE

          cat > twa/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' version '8.2.2' apply false }
          GRADLE

          cat > twa/gradle.properties <<'GRADLE'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          GRADLE

          cat > twa/app/build.gradle <<GRADLE
          plugins { id 'com.android.application' }
          android {
              namespace '${APP_ID}'
              compileSdk 34
              defaultConfig {
                  applicationId '${APP_ID}'
                  minSdk 21
                  targetSdk 34
                  versionCode ${{ github.run_number }}
                  versionName '1.${{ github.run_number }}'
              }
              signingConfigs {
                  release {
                      storeFile file(System.getenv('KS_PATH'))
                      storePassword System.getenv('KS_PASS')
                      keyAlias 'geocam'
                      keyPassword System.getenv('KS_PASS')
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
              implementation 'com.google.android.gms:play-services-location:21.3.0'
              implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
          }
          GRADLE

          cat > twa/app/src/main/res/values/res.xml <<XML
          <resources>
              <string name="app_name">${APP_NAME}</string>
              <color name="ink">#121a16</color>
              <string name="asset_statements">[{\"relation\": [\"delegate_permission/common.handle_all_urls\"], \"target\": {\"namespace\": \"web\", \"site\": \"https://naveensen260-dot.github.io\"}}]</string>
          </resources>
          XML

          cat > twa/app/src/main/AndroidManifest.xml <<XML
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Translucent.NoTitleBar">
                  <meta-data android:name="asset_statements" android:resource="@string/asset_statements" />
                  <activity
                      android:name=".GeoLauncherActivity"
                      android:label="@string/app_name"
                      android:exported="true">
                      <meta-data android:name="android.support.customtabs.trusted.DEFAULT_URL"
                          android:value="${APP_URL}" />
                      <meta-data android:name="android.support.customtabs.trusted.STATUS_BAR_COLOR"
                          android:resource="@color/ink" />
                      <meta-data android:name="android.support.customtabs.trusted.NAVIGATION_BAR_COLOR"
                          android:resource="@color/ink" />
                      <meta-data android:name="android.support.customtabs.trusted.SCREEN_ORIENTATION"
                          android:value="portrait" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <!-- Ek tap mein phone ki Location ON karne wala Google popup (geocam://location) -->
                  <activity
                      android:name=".EnableLocationActivity"
                      android:exported="true"
                      android:excludeFromRecents="true"
                      android:theme="@android:style/Theme.Translucent.NoTitleBar">
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="geocam" android:host="location" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          cat > twa/app/src/main/java/io/github/naveensen260dot/geocam/EnableLocationActivity.java <<'JAVA'
          package io.github.naveensen260dot.geocam;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.IntentSender;
          import android.os.Bundle;
          import android.provider.Settings;
          import com.google.android.gms.common.api.ResolvableApiException;
          import com.google.android.gms.location.LocationRequest;
          import com.google.android.gms.location.LocationServices;
          import com.google.android.gms.location.LocationSettingsRequest;
          import com.google.android.gms.location.Priority;

          /** GeoCam ke popup se khulta hai: Google ka "Turn on device location?" dabba dikhata hai, phir wapas app. */
          public class EnableLocationActivity extends Activity {
              private static final int REQ = 7;

              @Override
              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  LocationRequest req = new LocationRequest.Builder(Priority.PRIORITY_HIGH_ACCURACY, 1000).build();
                  LocationSettingsRequest settings = new LocationSettingsRequest.Builder()
                          .addLocationRequest(req).setAlwaysShow(true).build();
                  LocationServices.getSettingsClient(this).checkLocationSettings(settings)
                          .addOnSuccessListener(this, r -> close())
                          .addOnFailureListener(this, e -> {
                              if (e instanceof ResolvableApiException) {
                                  try {
                                      ((ResolvableApiException) e).startResolutionForResult(this, REQ);
                                      return;
                                  } catch (IntentSender.SendIntentException ignored) { }
                              }
                              openSettings();
                          });
              }

              private void openSettings() {
                  try { startActivity(new Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS)); } catch (Exception ignored) { }
                  close();
              }

              private void close() {
                  finish();
                  overridePendingTransition(0, 0);   // bina animation turant wapas
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  close();
              }
          }
          JAVA

          cat > twa/app/src/main/java/io/github/naveensen260dot/geocam/GeoLauncherActivity.java <<'JAVA'
          package io.github.naveensen260dot.geocam;

          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentSender;
          import android.location.LocationManager;
          import android.os.Bundle;
          import com.google.android.gms.common.api.ResolvableApiException;
          import com.google.android.gms.location.LocationRequest;
          import com.google.android.gms.location.LocationServices;
          import com.google.android.gms.location.LocationSettingsRequest;
          import com.google.android.gms.location.Priority;
          import com.google.androidbrowserhelper.trusted.LauncherActivity;

          /** App kholte hi: Location band ho to pehle Google ka "Turn on location?" dabba, phir GeoCam. */
          public class GeoLauncherActivity extends LauncherActivity {
              private static final int REQ = 8;
              private boolean launched = false;

              @Override
              protected boolean shouldLaunchImmediately() {
                  return false;
              }

              @Override
              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  if (isFinishing()) return;
                  if (locationOn()) { go(); return; }
                  try {
                      LocationRequest req = new LocationRequest.Builder(Priority.PRIORITY_HIGH_ACCURACY, 1000).build();
                      LocationSettingsRequest settings = new LocationSettingsRequest.Builder()
                              .addLocationRequest(req).setAlwaysShow(true).build();
                      LocationServices.getSettingsClient(this).checkLocationSettings(settings)
                              .addOnSuccessListener(this, r -> go())
                              .addOnFailureListener(this, e -> {
                                  if (e instanceof ResolvableApiException) {
                                      try {
                                          ((ResolvableApiException) e).startResolutionForResult(this, REQ);
                                          return;
                                      } catch (IntentSender.SendIntentException ignored) { }
                                  }
                                  go();
                              });
                  } catch (Exception e) {
                      go();
                  }
              }

              private boolean locationOn() {
                  try {
                      LocationManager lm = (LocationManager) getSystemService(Context.LOCATION_SERVICE);
                      return lm == null || lm.isProviderEnabled(LocationManager.GPS_PROVIDER)
                              || lm.isProviderEnabled(LocationManager.NETWORK_PROVIDER);
                  } catch (Exception e) {
                      return true;
                  }
              }

              private void go() {
                  if (launched || isFinishing()) return;
                  launched = true;
                  launchTwa();
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ) go();
              }
          }
          JAVA

      - name: Signing key taiyaar karna
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "KEYSTORE_BASE64 secret nahi mila – Settings > Secrets mein daalein"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/geocam.jks"

      - name: APK build karna
        working-directory: twa
        env:
          KS_PATH: ${{ runner.temp }}/geocam.jks
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: APK ka naam badalna
        run: cp twa/app/build/outputs/apk/release/app-release.apk GeoCam-HD.apk

      # APK seedha "Releases" mein .apk file ki tarah aayegi (zip/rar nahi)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: GeoCam HD v1.${{ github.run_number }}
          body: "Neeche Assets mein GeoCam-HD.apk dabakar download karein."
          files: GeoCam-HD.apk
          make_latest: true
